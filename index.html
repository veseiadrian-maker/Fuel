<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Fuel Rush 3D — Visual Foundation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08131d;color:#f3f7fb;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}header{position:fixed;z-index:3;top:12px;left:16px;pointer-events:none}h1{margin:0;font-size:21px;letter-spacing:2px}small{color:#a9bfd0}#ui{position:fixed;z-index:4;right:12px;top:12px;display:flex;gap:7px}button{border:1px solid #557286;background:#102638e8;color:#fff;padding:11px 13px;border-radius:10px;font-weight:700}button.active{background:#d9a72e;color:#101820}#status{position:fixed;z-index:5;left:12px;right:12px;bottom:12px;padding:11px 13px;border:1px solid #385366;border-radius:10px;background:#07131ee8;font-size:13px;line-height:1.4}#hint{position:fixed;top:72px;left:16px;color:#d2dde6;font-size:12px;z-index:3}@media(orientation:portrait){#rotate{display:flex}}#rotate{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;text-align:center;padding:28px;background:#08131ff2;font-size:22px}
</style></head><body>
<header><h1>FUEL <span style="color:#e6b344">RUSH</span> 3D</h1><small>STREET V8 · VISUAL FOUNDATION 01</small></header>
<div id="ui"><button id="garage" class="active">GARÁZS</button><button id="valley">GREEN VALLEY</button></div><div id="hint">Húzd az ujjad a kamera forgatásához</div><div id="status">3D motor indítása…</div><div id="rotate">Fordítsd vízszintesre a telefont ↻</div>
<script>
// This watchdog runs even if the ES module itself fails to download or parse.
window.__fr3dBooted=false;window.__fr3dTimer=setTimeout(()=>{if(!window.__fr3dBooted)document.querySelector('#status').textContent='Hiba: a 3D motor nem indult el. Frissítsd az oldalt; ha ismétlődik, ellenőrizd a CDN/internet elérését.'},12000);
window.addEventListener('error',e=>{const s=document.querySelector('#status');if(s)s.textContent='Indítási hiba: '+(e.message||'külső fájl nem töltődött be')});window.addEventListener('unhandledrejection',e=>{const s=document.querySelector('#status');if(s)s.textContent='Betöltési hiba: '+String(e.reason||'ismeretlen').slice(0,200)});
</script>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
import { GLTFLoader } from 'https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
const $=s=>document.querySelector(s),status=$('#status');window.__fr3dBooted=true;clearTimeout(window.__fr3dTimer);
try {
const scene=new THREE.Scene();scene.background=new THREE.Color('#142434');scene.fog=new THREE.FogExp2('#9db8c2',.0028);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,1000);camera.position.set(7,5,9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd6eaff,0x33402b,2));const sun=new THREE.DirectionalLight(0xffe2b3,3);sun.position.set(-20,35,15);scene.add(sun);
const garage=new THREE.Group(),valley=new THREE.Group();scene.add(garage,valley);
const material=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function add(geo,mat,pos,group){const o=new THREE.Mesh(geo,mat);o.position.set(...pos);o.receiveShadow=true;group.add(o);return o}
add(new THREE.CylinderGeometry(8,8,.22,80),material('#1d2b38',.35,.5),[0,-.2,0],garage);add(new THREE.CylinderGeometry(5.2,5.2,.08,80),material('#334553',.3,.5),[0,-.07,0],garage);
for(let i=0;i<20;i++){let a=i*Math.PI/10;add(new THREE.BoxGeometry(.13,.025,.55),material('#d6a63d',.3,.25),[Math.sin(a)*4.8,-.015,Math.cos(a)*4.8],garage)}
add(new THREE.PlaneGeometry(500,600),material('#42613a'),[0,-.2,-70],valley).rotation.x=-Math.PI/2;
add(new THREE.PlaneGeometry(16,500),material('#292e32',.98),[0,-.12,-70],valley).rotation.x=-Math.PI/2;
const lineMat=material('#f4edcf');for(let z=-310;z<170;z+=10){add(new THREE.PlaneGeometry(.14,4.3),lineMat,[0,-.105,z],valley).rotation.x=-Math.PI/2;for(const x of [-7.7,7.7])add(new THREE.PlaneGeometry(.18,9.5),lineMat,[x,-.105,z],valley).rotation.x=-Math.PI/2}
const trunk=material('#594733'),greens=['#254a2e','#315c38','#3c6b40'].map(c=>material(c));let seed=881;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}function tree(x,z,s){add(new THREE.CylinderGeometry(.13*s,.22*s,2.5*s,7),trunk,[x,1.15*s,z],valley);for(let j=0;j<3;j++)add(new THREE.ConeGeometry((1.55-j*.27)*s,2.3*s,7),greens[j], [x,(2.1+j*.72)*s,z],valley)}for(let i=0;i<300;i++){const x=(9+rnd()*45)*(rnd()<.5?-1:1),z=rnd()*460-300;tree(x,z,.65+rnd()*1.45)}
for(const x of [-8.5,8.5]){add(new THREE.BoxGeometry(.12,.3,470),material('#85949a',.45,.65),[x,.15,-70],valley);for(let z=-300;z<160;z+=5)add(new THREE.BoxGeometry(.09,.5,.09),material('#71838a',.5,.5),[x,.1,z],valley)}
const root=new THREE.Group();scene.add(root);let mode='garage',theta=.55,phi=.28,dist=10,drag=null,loaded=false;
const MODEL='https://raw.githubusercontent.com/JaronKBragg7337/spectral-gt-rs/main/spectral_gt_rs_game_ready.glb';
status.textContent='Autómodell letöltése…';
const loader=new GLTFLoader();const loadTimeout=setTimeout(()=>{if(!loaded)status.textContent='Az autómodell túl sokáig töltődik. Ellenőrizd a kapcsolatot; a modell URL-je: raw.githubusercontent.com'},25000);
loader.load(MODEL,gltf=>{loaded=true;clearTimeout(loadTimeout);const car=gltf.scene;car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const box=new THREE.Box3().setFromObject(car),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());car.position.sub(center);const scale=5.4/Math.max(size.x,size.z);car.scale.setScalar(scale);car.rotation.y=-Math.PI/2;root.add(car);root.position.y=.1;status.textContent='3D autó betöltve. Húzd az ujjad a forgatáshoz.'},xhr=>{if(xhr.total)status.textContent='Autómodell letöltése: '+Math.round(xhr.loaded/xhr.total*100)+'%'},err=>{clearTimeout(loadTimeout);status.textContent='Az autómodell nem tölthető be. Hiba: '+(err?.message||'hálózati vagy CORS-hiba')+'. A pálya ettől még megtekinthető.';console.error(err)});
function setMode(m){mode=m;garage.visible=m==='garage';valley.visible=m==='valley';$('#garage').classList.toggle('active',mode==='garage');$('#valley').classList.toggle('active',mode==='valley');scene.background.set(mode==='garage'?'#142434':'#91b8ce');scene.fog.color.set(mode==='garage'?'#9db8c2':'#a4c3cc');if(loaded)status.textContent=mode==='garage'?'Garázs · húzd az ujjad a modell forgatásához':'Green Valley · vizuális pályaelőnézet'}$('#garage').onclick=()=>setMode('garage');$('#valley').onclick=()=>setMode('valley');
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;theta+=(e.clientX-drag.x)*.008;phi=THREE.MathUtils.clamp(phi+(e.clientY-drag.y)*.005,-.2,1);drag={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>dist=THREE.MathUtils.clamp(dist+e.deltaY*.012,6,24),{passive:true});
let last=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-last)/1000,.05);last=t;if(mode==='garage'&&!drag)theta+=dt*.08;const target=mode==='garage'?new THREE.Vector3(Math.sin(theta)*Math.cos(phi)*dist,2.8+Math.sin(phi)*dist*.5,Math.cos(theta)*Math.cos(phi)*dist):new THREE.Vector3(Math.sin(theta)*7,4+Math.sin(phi)*3,12+Math.cos(theta)*2);camera.position.lerp(target,.08);camera.lookAt(0,.65,0);renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){status.textContent='3D indítási hiba: '+(err?.message||String(err));console.error(err)}
</script></body></html>
