<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Fuel Rush 3D — Street V8</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111d;color:#f5f7fb;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}header{position:fixed;z-index:2;top:12px;left:15px;pointer-events:none}h1{margin:0;font-size:21px;letter-spacing:2px}small{color:#afc3d3}#buttons{position:fixed;z-index:3;top:12px;right:12px;display:flex;gap:7px}button{border:1px solid #536b7c;border-radius:10px;padding:10px 12px;background:#112638ed;color:white;font-weight:700}button.active{background:#e5b43d;color:#121820}#status{position:fixed;z-index:2;bottom:12px;left:12px;right:12px;background:#07131ee8;border:1px solid #385366;border-radius:10px;padding:10px 12px;font-size:12px}#hint{position:fixed;top:68px;left:16px;color:#d2dde6;font-size:12px;z-index:2}@media(orientation:portrait){#rotate{display:flex}}#rotate{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;text-align:center;padding:28px;background:#08131ff2;font-size:22px}</style></head><body>
<header><h1>FUEL <span style="color:#e6b344">RUSH</span> 3D</h1><small>STREET V8 · BODY REBUILD V2</small></header><div id="buttons"><button id="garage" class="active">GARÁZS</button><button id="valley">GREEN VALLEY</button></div><div id="hint">Húzd az ujjad a nézet forgatásához · csippentéssel nagyíthatsz</div><div id="status">3D jelenet indítása…</div><div id="rotate">Fordítsd vízszintesre a telefont ↻</div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
const $=s=>document.querySelector(s), status=$('#status');
try {
const scene=new THREE.Scene(); scene.background=new THREE.Color('#142333'); scene.fog=new THREE.Fog('#a8c1c9',35,170);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,500); camera.position.set(7,4.5,8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe1efff,0x35412f,2.2)); const sun=new THREE.DirectionalLight(0xffe0b1,3.3);sun.position.set(-8,14,9);scene.add(sun); const rim=new THREE.DirectionalLight(0x4e9cff,2);rim.position.set(8,5,-10);scene.add(rim);
const garage=new THREE.Group(), valley=new THREE.Group();scene.add(garage,valley);
const mat=(c,r=.45,m=.1,extra={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...extra});
const paint=mat('#123f75',.23,.72,{metalness:.78}), dark=mat('#0b1118',.35,.3), glass=mat('#101f2b',.18,.5,{metalness:.35}), chrome=mat('#aebbc5',.22,.8), rubber=mat('#111316',.86,.02), rimMat=mat('#687782',.27,.85), red=mat('#d22d25',.3,.2), lamp=mat('#d8f3ff',.18,.2,{emissive:'#b7eaff',emissiveIntensity:1.4}), tail=mat('#ff3527',.22,.2,{emissive:'#a80000',emissiveIntensity:1.2});
function mesh(g,m,p,par,rot){const o=new THREE.Mesh(g,m);o.position.set(...p);if(rot)o.rotation.set(...rot);o.castShadow=true;o.receiveShadow=true;par.add(o);return o}
function box(m,s,p,par,r=[0,0,0]){return mesh(new THREE.BoxGeometry(...s),m,p,par,r)}
// Display plinth
mesh(new THREE.CylinderGeometry(6.8,6.8,.22,96),mat('#1a2936',.28,.65),[0,-.22,0],garage);mesh(new THREE.CylinderGeometry(5.7,5.7,.06,96),mat('#334756',.24,.65),[0,-.08,0],garage);
for(let i=0;i<32;i++){let a=i*Math.PI/16;box(mat('#d7a33b',.28,.5),[.1,.025,.38],[Math.sin(a)*5.35,-.04,Math.cos(a)*5.35],garage,[0,a,0])}
// Roadside environment
mesh(new THREE.PlaneGeometry(300,380),mat('#49683d',1),[0,-.23,-70],valley,[-Math.PI/2,0,0]);mesh(new THREE.PlaneGeometry(15,380),mat('#282d32',.96),[0,-.13,-70],valley,[-Math.PI/2,0,0]);const line=mat('#eee6cb',.8);for(let z=-250;z<120;z+=11){mesh(new THREE.PlaneGeometry(.13,4.8),line,[0,-.105,z],valley,[-Math.PI/2,0,0]);for(let x of [-7.1,7.1])mesh(new THREE.PlaneGeometry(.16,8),line,[x,-.105,z],valley,[-Math.PI/2,0,0])}
const bark=mat('#574632'), leaf=[mat('#21472d',1),mat('#315d37',1),mat('#477447',1)];let seed=2026;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<220;i++){let x=(9+rnd()*34)*(rnd()<.5?-1:1),z=-250+rnd()*370,s=.7+rnd()*1.2;mesh(new THREE.CylinderGeometry(.12*s,.2*s,2.3*s,8),bark,[x,1.05*s,z],valley);for(let j=0;j<3;j++)mesh(new THREE.ConeGeometry((1.45-j*.28)*s,2.2*s,8),leaf[j],[x,(2+j*.68)*s,z],valley)}
for(let x of [-8,8]){box(mat('#8b989b',.5,.7),[.13,.28,370],[x,.12,-65],valley);for(let z=-245;z<120;z+=6)box(chrome,[.08,.44,.08],[x,.05,z],valley)}
// Street V8: single continuous sculpted side silhouette, extruded across car width.
const car=new THREE.Group();garage.add(car);
const side=new THREE.Shape();
side.moveTo(-2.68,.48); side.lineTo(-2.62,.72); side.lineTo(-2.28,.84); side.lineTo(-1.72,.88); side.lineTo(-1.12,.92); side.lineTo(-.58,.91); side.lineTo(.48,.91); side.lineTo(1.12,.88); side.lineTo(1.82,.86); side.lineTo(2.48,.76); side.lineTo(2.68,.59); side.lineTo(2.60,.43); side.lineTo(-2.55,.43); side.close();
const bodyGeo=new THREE.ExtrudeGeometry(side,{depth:1.68,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.07,bevelThickness:.06,curveSegments:16});bodyGeo.translate(0,0,-.84);const body=mesh(bodyGeo,paint,[0,0,0],car);body.castShadow=true;
// Hood and trunk sculpted panels
const hood=mesh(new THREE.BoxGeometry(1.35,.12,1.45),paint,[1.72,.82,0],car,[0,0,-.025]); hood.scale.set(1,.8,1);
mesh(new THREE.BoxGeometry(.62,.1,1.43),paint,[-2.18,.81,0],car,[0,0,.025]);
// Cabin with sloped windshield and rear glass: compact fastback profile
const cabShape=new THREE.Shape();cabShape.moveTo(-1.28,.86);cabShape.lineTo(-.78,1.53);cabShape.quadraticCurveTo(-.66,1.64,-.48,1.64);cabShape.lineTo(.52,1.64);cabShape.quadraticCurveTo(.7,1.61,.82,1.45);cabShape.lineTo(1.22,.86);cabShape.close();const cabGeo=new THREE.ExtrudeGeometry(cabShape,{depth:1.26,bevelEnabled:true,bevelSegments:3,bevelSize:.045,bevelThickness:.035,curveSegments:12});cabGeo.translate(0,0,-.63);mesh(cabGeo,paint,[0,0,0],car);
// Dark side glass panels
for(let z of [-.645,.645]){const winShape=new THREE.Shape();winShape.moveTo(-.99,.98);winShape.lineTo(-.62,1.48);winShape.lineTo(-.42,1.52);winShape.lineTo(.37,1.52);winShape.lineTo(.69,1.43);winShape.lineTo(1.02,.98);winShape.close();const wg=new THREE.ShapeGeometry(winShape);mesh(wg,glass,[0,0,z],car,[0,0,0]);}
// front/rear glass slanted planes
mesh(new THREE.PlaneGeometry(1.12,.48),glass,[-.58,1.34,0],car,[0,0,-.52]);mesh(new THREE.PlaneGeometry(1.02,.43),glass,[.86,1.32,0],car,[0,0,.58]);
// roof panel and roof edge trim
mesh(new THREE.BoxGeometry(.86,.055,1.20),paint,[.02,1.635,0],car,[0,0,0]);
// Wheel assembly: four aligned wheels, detailed rim discs, hubs and spokes
function wheel(x,z){const w=new THREE.Group();w.position.set(x,.49,z);car.add(w);mesh(new THREE.CylinderGeometry(.455,.455,.27,40),rubber,[0,0,0],w,[Math.PI/2,0,0]);mesh(new THREE.CylinderGeometry(.305,.305,.285,32),rimMat,[0,0,0],w,[Math.PI/2,0,0]);mesh(new THREE.CylinderGeometry(.22,.22,.29,32),dark,[0,0,0],w,[Math.PI/2,0,0]);for(let i=0;i<10;i++){let a=i*Math.PI/5;mesh(new THREE.BoxGeometry(.055,.34,.045),chrome,[Math.sin(a)*.11,Math.cos(a)*.11,0],w,[0,0,-a]);}mesh(new THREE.CylinderGeometry(.075,.075,.31,24),chrome,[0,0,0],w,[Math.PI/2,0,0]);mesh(new THREE.CylinderGeometry(.12,.12,.018,32),dark,[0,0,.15],w,[Math.PI/2,0,0]);}
for(let x of [-1.55,1.55])for(let z of [-.91,.91])wheel(x,z);
// Front fascia, grille, headlights and rear lamps
box(dark,[.16,.26,.88],[2.61,.61,0],car);box(chrome,[.035,.045,.57],[2.704,.62,0],car);for(let z of [-.55,.55]){box(lamp,[.1,.14,.34],[2.59,.73,z],car,[0,0,-.08]);box(dark,[.12,.035,.38],[2.59,.63,z],car)}
box(dark,[.12,.17,.78],[-2.59,.59,0],car);for(let z of [-.56,.56])box(tail,[.08,.13,.28],[-2.66,.72,z],car);
// mirrors, door seams, handles, fender accents and exhaust
for(let z of [-.84,.84]){box(dark,[.20,.10,.13],[-.55,1.12,z*1.02],car,[0,0,-.12]);box(dark,[.025,.34,.012],[-.2,.88,z*1.005],car);box(chrome,[.08,.025,.025],[-.03,1.02,z*1.015],car);box(dark,[.6,.04,.035],[1.68,.91,z*1.02],car);}
for(let z of [-.44,.44])mesh(new THREE.CylinderGeometry(.075,.075,.2,16),chrome,[-2.72,.48,z],car,[Math.PI/2,0,0]);
// hood vents and broad front splitter
for(let z of [-.3,0,.3])box(dark,[.42,.025,.055],[1.8,.895,z],car,[0,0,-.025]);box(dark,[.26,.055,1.52],[2.64,.43,0],car);
// Green Valley and garage visibility
function mode(m){garage.visible=m==='garage';valley.visible=m==='valley';$('#garage').classList.toggle('active',m==='garage');$('#valley').classList.toggle('active',m==='valley');scene.background.set(m==='garage'?'#142333':'#9dbacb');scene.fog.color.set(m==='garage'?'#a8c1c9':'#a8c1c9');status.textContent=m==='garage'?'Street V8 · egybefüggő saját karosszériamodell':'Green Valley · pályaelőnézet';}
$('#garage').onclick=()=>mode('garage');$('#valley').onclick=()=>mode('valley');
let theta=.65,phi=.20,dist=10.8,drag=null;renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;theta+=(e.clientX-drag.x)*.008;phi=THREE.MathUtils.clamp(phi+(e.clientY-drag.y)*.005,-.12,.8);drag={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>dist=THREE.MathUtils.clamp(dist+e.deltaY*.012,5.5,16),{passive:true});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function animate(){requestAnimationFrame(animate);if(!drag&&garage.visible)theta+=.0015;const target=garage.visible?new THREE.Vector3(Math.sin(theta)*Math.cos(phi)*dist,1.35+Math.sin(phi)*dist*.5,Math.cos(theta)*Math.cos(phi)*dist):new THREE.Vector3(Math.sin(theta)*6,4,12+Math.cos(theta)*2);camera.position.lerp(target,.09);camera.lookAt(0,.88,0);renderer.render(scene,camera)}
mode('garage');status.textContent='Street V8 · átdolgozott karosszéria és kerékpozíció';animate();
}catch(e){status.textContent='3D indítási hiba: '+(e.message||e);console.error(e)}
</script></body></html>
